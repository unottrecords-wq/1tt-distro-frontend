<!-- AUTHENTICATION CARD -->
<section id="auth-section" class="card">
  <h2>1TT DISTRO — Artist Sign In / Register</h2>
  
  <form id="auth-form">
    <!-- Extra profile metadata for new artist signups -->
    <div id="signup-extra-fields" class="form-group hidden">
      <label for="artist-name">Artist / Stage Name</label>
      <input type="text" id="artist-name" placeholder="e.g. ZOWA ZAR" />

      <label for="legal-name">Legal Name (For Publishing & Contracts)</label>
      <input type="text" id="legal-name" placeholder="e.g. Abongile Gando" />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="artist@1ttrecords.com" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required />
    </div>

    <div class="button-group">
      <button type="submit" id="login-btn">Log In</button>
      <button type="button" id="toggle-signup-btn" class="btn-secondary">Register New Artist</button>
    </div>
  </form>

  <div id="auth-status" class="status-msg"></div>
</section>
