<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1TT DISTRO — Artist Command Center</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>1TT DISTRO</h1>
    <p>Independent Music & Video Distribution Portal</p>
  </header>

  <main>
    <!-- AUTHENTICATION CARD -->
    <section id="auth-section" class="card">
      <h2>Artist Portal Sign In</h2>
      <form id="auth-form">
        <input type="email" id="email" placeholder="Artist Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <div class="button-group">
          <button type="submit" id="login-btn">Log In</button>
          <button type="button" id="signup-btn">Register</button>
        </div>
      </form>
      <div id="auth-status" class="status-msg"></div>
    </section>

    <!-- ARTIST DASHBOARD & RELEASE CREATOR -->
    <section id="dashboard-section" class="card hidden">
      <div class="user-header">
        <div>
          <h2>Artist Command Center</h2>
          <p id="user-email-display"></p>
        </div>
        <button id="logout-btn" class="btn-secondary">Sign Out</button>
      </div>

      <hr />

      <!-- CREATE NEW RELEASE -->
      <h3>Create New Release</h3>
      <form id="release-form">
        <div class="form-group">
          <label>Release Title</label>
          <input type="text" id="release-title" placeholder="e.g. GOD MODE" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Release Type</label>
            <select id="release-type">
              <option value="Single">Single</option>
              <option value="EP">EP</option>
              <option value="Album">Album</option>
            </select>
          </div>
          <div class="form-group">
            <label>UPC Barcode (Optional)</label>
            <input type="text" id="release-upc" placeholder="e.g. 123456789012" />
          </div>
        </div>

        <div class="form-group">
          <label>Cover Artwork (JPG/PNG)</label>
          <input type="file" id="cover-art-file" accept="image/jpeg, image/png" required />
        </div>

        <hr />
        <h4>Track Details</h4>
        <div class="form-group">
          <label>Track Title</label>
          <input type="text" id="track-title" placeholder="e.g. Chopper (Extended Mix)" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>ISRC Code (Optional)</label>
            <input type="text" id="track-isrc" placeholder="e.g. ZA-1TT-26-00001" />
          </div>
          <div class="form-group">
            <label>Composer (Legal Name)</label>
            <input type="text" id="composer-name" placeholder="e.g. Abongile Gando" required />
          </div>
        </div>

        <div class="form-group">
          <label>Audio File (WAV Master)</label>
          <input type="file" id="audio-file" accept="audio/wav, audio/x-wav, audio/flac" required />
        </div>

        <button type="submit" id="submit-btn">Submit Release & Upload Master</button>
      </form>
      <div id="upload-status" class="status-msg"></div>

      <hr />

      <!-- MY CATALOG SECTION -->
      <h3>Your Catalog Releases</h3>
      <div id="catalog-list">Loading catalog...</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
